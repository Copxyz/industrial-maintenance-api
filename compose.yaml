services:
  postgres:
    image: postgres:18
    container_name: industrial-maintenance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: maintenance_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD environment variable}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maintenance_system"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    image: industrial-maintenance-api:latest
    container_name: industrial-maintenance-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/maintenance_system
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD environment variable}
    ports:
      - "8080:8080"

volumes:
  postgres_data: